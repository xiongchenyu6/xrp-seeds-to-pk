[tool.poetry]
name = "xrp-seeds-to-pk"
version = "0.1.0"
description = ""
authors = ["freeman <xiongchenyu6@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
xrpl-py = "^5.2.0"
bip-utils = "^2.12.3"
mnemonic = "^0.21"
# Security floors: keep the HTTP transport compatible and prevent vulnerable downgrades.
httpx = ">=0.28.1,<0.29"
httpcore = ">=1.0.9,<2"
h11 = ">=0.16,<0.17"
certifi = ">=2026.10.18"
pynacl = ">=1.6.2,<2"
# 0.2.2+ no longer ships Python 3.10 wheels.
py-sr25519-bindings = {version = ">=0.2.1,<0.2.2", python = "<3.11"}


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
